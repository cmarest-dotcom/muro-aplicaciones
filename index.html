function modal(title,content,wide=false){$('#modal-root').innerHTML=`<div class="modal-backdrop" id="backdrop"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${escapeHTML(title)}"><div class="modal-head"><h2>${escapeHTML(title)}</h2><button class="x" data-close aria-label="Cerrar">×</button></div>${content}</div></div>`;$('#backdrop').addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeModal()});document.addEventListener('keydown',onEscape);}

function normalizeModerationText(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[@4]/g,'a').replace(/[0]/g,'o').replace(/[1!]/g,'i').replace(/[$5]/g,'s').replace(/[^a-z0-9ñ]+/g,' ')}
const rudeWords=/\b(?:puta|putas|puto|putos|putada|putadas|mierda|mierdas|joder|jodete|coño|cojones|cabron|cabrona|cabrones|gilipollas|gilipollas|imbecil|imbeciles|idiota|idiotas|subnormal|subnormales|maricon|maricones|zorra|zorras|hijoputa|hijadeputa|pendejo|pendeja|fuck|shit|bitch|asshole)\b/i;

async function analyzeResource(url){
  if(!client) return null;

  if(res.error)throw Error('No se pudo comprobar la web: '+res.error.message+'; no se enviará sin verificarla');

async function toggleAuth(){if(admin){if(client)await client.auth.signOut();admin=false;await (client?loadCloud():Promise.resolve());render();toast('Vista pública activada')}else login()}
function share(){let url=location.href.split('#')[0];if(location.protocol==='file:'||!cloud){toast('Para compartirlo entre usuarios, primero hay que publicarlo con Supabase y un hosting. Consulta README.');return}if(navigator.share){navigator.share({title:prefs.title,url}).catch(()=>{})}else if(navigator.clipboard?.writeText){navigator.clipboard.writeText(url).then(()=>toast('Enlace copiado')).catch(()=>prompt('Copia este enlace:',url))}else prompt('Copia este enlace:',url)}
function openLink(id){let item=visibleLinks().find(l=>l.id===id);if(item){let url=safeUrl(item.url);if(url)window.open(url,'_blank','noopener,noreferrer')}}
$('#main').addEventListener('click',e=>{let editL=e.target.closest('[data-edit-link]');if(editL){editLink(editL.dataset.editLink);return}let editF=e.target.closest('[data-edit-folder]');if(editF){editFolder(editF.dataset.editFolder);return}let f=e.target.closest('[data-folder]');if(f){filter=f.dataset.folder;render();window.scrollTo({top:0,behavior:'smooth'});return}let link=e.target.closest('[data-open]');if(link)openLink(link.dataset.open)});
$('#main').addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;if(e.target.matches('[data-open]')){e.preventDefault();openLink(e.target.dataset.open)}else if(e.target.matches('[data-folder]')){e.preventDefault();filter=e.target.dataset.folder;render()}});
$('#filter-chips').addEventListener('click',e=>{let b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}});$('#search').addEventListener('input',e=>{query=e.target.value;render()});$('#new-btn').onclick=$('#float-add').onclick=()=>editLink();$('#folder-new').onclick=()=>editFolder();$('#manage-btn').onclick=settings;$('#auth-btn').onclick=toggleAuth;$('#share-btn').onclick=share;$('#request-new').onclick=requestForm;$('#requests-inbox').onclick=inbox;document.addEventListener('visibilitychange',()=>{if(!document.hidden&&client&&admin)loadRequests().then(render).catch(()=>{})});setInterval(()=>{if(client&&admin&&!document.hidden)loadRequests().then(render).catch(()=>{})},45000);
if(client){establishSession().catch(err=>{render();toast('No se pudo conectar: '+err.message)})}else render();
if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));}
})();
</script></body></html>
